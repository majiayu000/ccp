<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ccp — Claude Code Profiles</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0b;
    --card: rgba(255,255,255,.028);
    --card-hover: rgba(255,255,255,.05);
    --border: rgba(255,255,255,.08);
    --border-soft: rgba(255,255,255,.05);
    --text: #ededf0;
    --muted: #9a9fab;
    --faint: #62666f;
    --accent: #8b85ff;
    --ok: #4ecb8d;
    --warn: #e5b567;
    --danger: #e06767;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14.5px/1.65 -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit;
           border-radius: 8px; padding: 6px 14px; transition: all .14s ease; }
  button:active { transform: scale(.96); }
  .btn-primary { background: #fafafa; color: #0a0a0b; font-weight: 600; }
  .btn-primary:hover { background: #fff; box-shadow: 0 2px 18px rgba(255,255,255,.14); }
  .btn-ghost { border: 1px solid var(--border); color: var(--muted); }
  .btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,.2); background: var(--card-hover); }
  .btn-danger { color: var(--faint); }
  .btn-danger:hover { color: var(--danger); background: rgba(224,103,103,.08); }
  .btn-sm { padding: 4px 11px; font-size: 12.5px; border-radius: 7px; }

  input, select {
    width: 100%; background: rgba(255,255,255,.035); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 8px 12px; font: inherit; font-size: 13.5px;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(139,133,255,.16); }
  input::placeholder { color: var(--faint); }
  label { display: block; font-size: 11.5px; color: var(--muted); margin: 13px 0 5px;
          font-family: var(--mono); letter-spacing: .02em; }

  /* ---------- top bar ---------- */
  .topbar { position: sticky; top: 0; z-index: 5; backdrop-filter: blur(14px);
            background: rgba(10,10,11,.75); border-bottom: 1px solid var(--border-soft); }
  .topbar-inner { max-width: 780px; margin: 0 auto; padding: 13px 24px;
                  display: flex; align-items: center; gap: 12px; }
  .logo { width: 27px; height: 27px; border-radius: 8px; display: grid; place-items: center;
          background: linear-gradient(135deg, #8b85ff, #5f6cff); color: #fff;
          font-weight: 700; font-size: 13px; }
  .topbar b { font-size: 15px; letter-spacing: -.01em; }
  .topbar .sub { color: var(--faint); font-size: 12px; }
  .topbar .spacer { flex: 1; }

  /* ---------- layout ---------- */
  .wrap { max-width: 780px; margin: 0 auto; padding: 34px 24px 90px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between;
               margin-bottom: 22px; }
  .page-head h1 { font-size: 24px; margin: 0; letter-spacing: -.02em; }
  .page-head .count { color: var(--faint); font-size: 13px; margin-left: 8px; }

  /* ---------- unmanaged banner ---------- */
  .banner { display: flex; align-items: center; gap: 12px; background: rgba(229,181,103,.06);
            border: 1px solid rgba(229,181,103,.18); border-radius: 12px;
            padding: 12px 18px; margin-bottom: 18px; font-size: 13px; color: var(--warn); }
  .banner .names { color: var(--text); font-family: var(--mono); font-size: 12.5px; }
  .banner button { margin-left: auto; border-color: rgba(229,181,103,.3); color: var(--warn); }
  .banner button:hover { background: rgba(229,181,103,.1); color: var(--warn); }

  /* ---------- profile card ---------- */
  .card { background: var(--card); border: 1px solid var(--border-soft); border-radius: 14px;
          padding: 18px 20px; margin-bottom: 14px; transition: border-color .15s, background .15s; }
  .card:hover { border-color: var(--border); }
  .card-head { display: flex; align-items: center; gap: 13px; }
  .avatar { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
            font-weight: 650; font-size: 15px; color: rgba(255,255,255,.92); flex-shrink: 0; }
  .card-head .name { font-size: 16px; font-weight: 620; letter-spacing: -.01em; }
  .badge { font-size: 11px; font-family: var(--mono); color: var(--accent);
           background: rgba(139,133,255,.1); border: 1px solid rgba(139,133,255,.22);
           border-radius: 99px; padding: 1px 9px; }
  .badge.plain { color: var(--faint); background: none; border-color: var(--border); }
  .card-head .acts { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .home { color: var(--faint); font-family: var(--mono); font-size: 12px; margin: 8px 0 0 51px; }
  .envchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0 51px; }
  .chip { font-family: var(--mono); font-size: 11.5px; color: var(--muted);
          background: rgba(255,255,255,.04); border: 1px solid var(--border-soft);
          border-radius: 7px; padding: 3px 9px; }
  .chip b { color: #7fb0ff; font-weight: 600; }
  .env-none { color: var(--faint); font-size: 12.5px; }

  .test-result { font-size: 12px; font-family: var(--mono); margin-right: 4px; }
  .test-result.ok { color: var(--ok); }
  .test-result.bad { color: var(--danger); }
  .test-result.testing { color: var(--faint); }

  /* ---------- sessions ---------- */
  .sess-toggle { display: flex; align-items: center; gap: 7px; margin: 14px 0 0 51px;
                 color: var(--faint); font-size: 12.5px; padding: 0; }
  .sess-toggle:hover { color: var(--muted); }
  .sess-toggle .arrow { transition: transform .18s; font-size: 10px; }
  .sess-toggle.open .arrow { transform: rotate(90deg); }
  .sess-list { margin: 10px 0 0 51px; border-top: 1px solid var(--border-soft); }
  .sess { display: flex; align-items: center; gap: 12px; padding: 9px 4px;
          border-bottom: 1px solid var(--border-soft); }
  .sess .preview { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden;
                   text-overflow: ellipsis; font-size: 13px; color: #d4d7de; }
  .sess .meta { color: var(--faint); font-family: var(--mono); font-size: 11px;
                max-width: 220px; overflow: hidden; text-overflow: ellipsis;
                white-space: nowrap; direction: rtl; }
  .sess .time { color: var(--faint); font-size: 11.5px; min-width: 60px; text-align: right; }
  .sess-empty { color: var(--faint); font-size: 12.5px; padding: 12px 4px; }

  /* ---------- modal ---------- */
  .backdrop { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
              background: rgba(0,0,0,.6); backdrop-filter: blur(4px); }
  .modal { width: 600px; max-width: 93vw; max-height: 86vh; overflow-y: auto;
           background: #121215; border: 1px solid var(--border); border-radius: 16px;
           padding: 26px 28px; box-shadow: 0 30px 90px rgba(0,0,0,.6); }
  .modal h2 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
  .modal .hint { color: var(--faint); font-size: 12.5px; margin: 6px 0 4px; line-height: 1.7; }
  .modal .hint code { font-family: var(--mono); font-size: 11.5px; color: var(--muted);
                      background: rgba(255,255,255,.05); padding: 1px 6px; border-radius: 5px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .kvrow { display: grid; grid-template-columns: 1fr 1.3fr 30px; gap: 8px; margin-top: 8px; }
  .kvrow button { padding: 0; height: 35px; align-self: end; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px;
                padding-top: 16px; border-top: 1px solid var(--border-soft); }
  .form-err { color: var(--danger); font-size: 12.5px; margin-top: 10px; }

  /* ---------- toast ---------- */
  #toast { position: fixed; bottom: 28px; left: 50%; z-index: 30;
           transform: translateX(-50%) translateY(16px);
           background: #1a1a1e; border: 1px solid var(--border); border-radius: 99px;
           padding: 9px 20px; font-size: 13px; opacity: 0; pointer-events: none;
           transition: all .25s cubic-bezier(.2,.9,.3,1.2); box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.err { border-color: rgba(224,103,103,.45); color: #f0b3b3; }
  #toast.ok { border-color: rgba(78,203,141,.35); }
  ::-webkit-scrollbar { width: 9px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 99px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="logo">⌘</div>
    <b>ccp</b>
    <span class="sub">每个 API 源一个隔离家目录,会话永不串</span>
    <div class="spacer"></div>
    <button class="btn-ghost btn-sm" id="export-btn">导出</button>
    <button class="btn-ghost btn-sm" id="import-btn">导入</button>
    <button class="btn-ghost btn-sm" id="shared-btn" title="所有 profile 共用的环境变量">共享变量</button>
  </div>
</div>

<div class="wrap">
  <div class="page-head">
    <div><h1>Profiles<span class="count" id="count"></span></h1></div>
    <button class="btn-primary" id="new-btn">+ 新建 profile</button>
  </div>
  <div id="unmanaged-wrap" hidden></div>
  <div id="profile-list"></div>
</div>

<input type="file" id="import-file" accept=".json" hidden>

<div id="modal-backdrop" class="backdrop" hidden>
  <div class="modal">
    <h2 id="editor-title">新建 profile</h2>
    <div class="hint">每个 profile 一个独立家目录 <code>~/.claude-&lt;name&gt;</code>,会话、登录、配置互不影响</div>
    <div id="create-only">
      <label>名称(小写字母/数字/连字符)</label>
      <input id="f-name" placeholder="kimi">
      <label>预设(选中自动填充,可改)</label>
      <select id="f-preset"></select>
    </div>
    <div class="grid2">
      <div><label>ANTHROPIC_BASE_URL</label><input id="f-base" placeholder="https://…"></div>
      <div><label>ANTHROPIC_AUTH_TOKEN</label><input id="f-token" placeholder="sk-…"></div>
      <div><label>ANTHROPIC_MODEL</label><input id="f-model"></div>
      <div><label>ANTHROPIC_SMALL_FAST_MODEL</label><input id="f-small"></div>
      <div><label>DEFAULT_HAIKU_MODEL</label><input id="f-haiku"></div>
      <div><label>DEFAULT_SONNET_MODEL</label><input id="f-sonnet"></div>
      <div><label>DEFAULT_OPUS_MODEL</label><input id="f-opus"></div>
      <div><label>MAX_CONTEXT_TOKENS</label><input id="f-ctx"></div>
    </div>
    <label>高级(任意其他环境变量)</label>
    <div id="kv-list"></div>
    <button class="btn-ghost btn-sm" id="kv-add" style="margin-top:10px">+ 添加变量</button>
    <div class="form-err" id="editor-msg"></div>
    <div class="modal-foot">
      <button class="btn-ghost" id="editor-cancel">取消</button>
      <button class="btn-primary" id="editor-save">保存</button>
    </div>
  </div>
</div>

<div id="shared-backdrop" class="backdrop" hidden>
  <div class="modal">
    <h2>共享环境变量 <span class="badge plain">高级,可留空</span></h2>
    <div class="hint">
      在这里配置的变量,启动<b>任何</b> profile 时都会自动带上,不用每个 profile 各配一遍。<br>
      例:<code>CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = 1</code>(所有源统一关闭遥测流量)。<br>
      如果某个 profile 自己配了同名变量,以 profile 自己的值为准。<b>没有这类需求就空着,不影响任何使用。</b>
    </div>
    <div id="shared-list"></div>
    <button class="btn-ghost btn-sm" id="shared-add" style="margin-top:10px">+ 添加变量</button>
    <div class="form-err" id="shared-msg"></div>
    <div class="modal-foot">
      <button class="btn-ghost" id="shared-cancel">取消</button>
      <button class="btn-primary" id="shared-save">保存</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const STD_FIELDS = [
  ["f-base",  "ANTHROPIC_BASE_URL"],
  ["f-token", "ANTHROPIC_AUTH_TOKEN"],
  ["f-model", "ANTHROPIC_MODEL"],
  ["f-small", "ANTHROPIC_SMALL_FAST_MODEL"],
  ["f-haiku", "ANTHROPIC_DEFAULT_HAIKU_MODEL"],
  ["f-sonnet","ANTHROPIC_DEFAULT_SONNET_MODEL"],
  ["f-opus",  "ANTHROPIC_DEFAULT_OPUS_MODEL"],
  ["f-ctx",   "CLAUDE_CODE_MAX_CONTEXT_TOKENS"],
];
const STD_KEYS = new Set(STD_FIELDS.map(([, k]) => k));
let presets = [];
let editing = null;
const openSess = new Set();   // profile names with sessions expanded

/* ---------- helpers ---------- */
async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "content-type": "application/json" }, ...opts });
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).error || msg; } catch (_) {}
    throw new Error(msg);
  }
  return res.status === 204 ? null : res.json();
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function hueOf(name) {
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
  return h;
}
function avatarHtml(name) {
  const h = hueOf(name);
  return `<div class="avatar" style="background:linear-gradient(135deg,hsl(${h},48%,52%),hsl(${(h+36)%360},48%,40%))">${esc(name[0].toUpperCase())}</div>`;
}
function relTime(secs) {
  const d = Date.now() / 1000 - secs;
  if (d < 3600) return `${Math.max(1, Math.round(d / 60))} 分钟前`;
  if (d < 86400) return `${Math.round(d / 3600)} 小时前`;
  if (d < 86400 * 30) return `${Math.round(d / 86400)} 天前`;
  return new Date(secs * 1000).toLocaleDateString("zh-CN");
}
let toastTimer = null;
function toast(text, kind = "") {
  const el = document.getElementById("toast");
  el.textContent = text;
  el.className = `show ${kind}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = "", 2800);
}

/* ---------- load & render ---------- */
async function loadAll() {
  const [presetList, data] = await Promise.all([api("/api/presets"), api("/api/profiles")]);
  presets = presetList;
  renderPresetSelect();
  renderUnmanaged(data.unmanaged);
  renderProfiles(data.profiles);
}

function renderUnmanaged(list) {
  const wrap = document.getElementById("unmanaged-wrap");
  wrap.hidden = !list.length;
  if (!list.length) return;
  wrap.innerHTML = `
    <div class="banner">
      <span>发现 <span class="names">${list.map(u => "~/.claude-" + esc(u.name)).join("、")}</span>
      共 ${list.length} 个未托管目录</span>
      <button class="btn-ghost btn-sm" onclick="importAll(${esc(JSON.stringify(list.map(u => u.name))).replace(/"/g, "&quot;")})">全部导入</button>
    </div>`;
}

function renderProfiles(profiles) {
  document.getElementById("count").textContent = profiles.length ? `${profiles.length} 个` : "";
  const el = document.getElementById("profile-list");
  if (!profiles.length) {
    el.innerHTML = '<div class="card env-none" style="padding:26px">还没有 profile,点右上角"新建"开始</div>';
    return;
  }
  el.innerHTML = profiles.map(p => {
    const chips = Object.entries(p.env);
    return `
    <div class="card" id="card-${esc(p.name)}">
      <div class="card-head">
        ${avatarHtml(p.name)}
        <span class="name">${esc(p.name)}</span>
        ${p.preset ? `<span class="badge">${esc(p.preset)}</span>` : ""}
        ${p.managed ? "" : '<span class="badge plain">未托管</span>'}
        <div class="acts">
          <span class="test-result" id="test-${esc(p.name)}"></span>
          <button class="btn-ghost btn-sm" onclick="doTest('${esc(p.name)}')">测试</button>
          <button class="btn-primary btn-sm" onclick="doLaunch('${esc(p.name)}')">▶ 启动</button>
          <button class="btn-ghost btn-sm" onclick="openEditor('${esc(p.name)}')">编辑</button>
          ${p.name === "default" ? "" :
            `<button class="btn-danger btn-sm" onclick="delProfile('${esc(p.name)}')">删除</button>`}
        </div>
      </div>
      <div class="home">${esc(p.home)}</div>
      <div class="envchips">
        ${chips.length ? chips.map(([k, v]) =>
          `<span class="chip"><b>${esc(k)}</b> = ${esc(v)}</span>`).join("")
          : '<span class="env-none">无额外变量 — 用该目录自身配置(官方登录 / settings.json)</span>'}
      </div>
      <button class="sess-toggle ${openSess.has(p.name) ? "open" : ""}"
              id="toggle-${esc(p.name)}" onclick="toggleSessions('${esc(p.name)}')">
        <span class="arrow">▶</span> 历史会话
      </button>
      <div class="sess-list" id="sess-${esc(p.name)}" ${openSess.has(p.name) ? "" : "hidden"}></div>
    </div>`;
  }).join("");
  for (const name of openSess) loadSessions(name);
}

async function toggleSessions(name) {
  const list = document.getElementById(`sess-${name}`);
  const toggle = document.getElementById(`toggle-${name}`);
  if (openSess.has(name)) {
    openSess.delete(name);
    list.hidden = true;
    toggle.classList.remove("open");
  } else {
    openSess.add(name);
    list.hidden = false;
    toggle.classList.add("open");
    await loadSessions(name);
  }
}

async function loadSessions(name) {
  const list = document.getElementById(`sess-${name}`);
  if (!list) return;
  list.innerHTML = '<div class="sess-empty">扫描中…</div>';
  try {
    const items = await api(`/api/profiles/${encodeURIComponent(name)}/sessions`);
    list.innerHTML = items.length ? items.map(s => `
      <div class="sess">
        <span class="preview">${esc(s.preview)}</span>
        ${s.cwd ? `<span class="meta" title="${esc(s.cwd)}">${esc(s.cwd)}</span>` : ""}
        <span class="time">${relTime(s.modified)}</span>
        <button class="btn-ghost btn-sm"
          onclick="doResume('${esc(name)}','${esc(s.id)}','${esc(s.cwd || "")}')">续聊</button>
      </div>`).join("")
      : '<div class="sess-empty">还没有历史会话</div>';
  } catch (e) {
    list.innerHTML = `<div class="sess-empty">加载失败:${esc(e.message)}</div>`;
  }
}

/* ---------- actions ---------- */
async function doLaunch(name) {
  try {
    await api(`/api/profiles/${encodeURIComponent(name)}/launch`, { method: "POST", body: "{}" });
    toast(`已在新终端窗口启动 ${name}`, "ok");
  } catch (e) { toast(e.message, "err"); }
}
async function doResume(name, id, cwd) {
  try {
    await api(`/api/profiles/${encodeURIComponent(name)}/launch`,
      { method: "POST", body: JSON.stringify({ resume: id, cwd: cwd || null }) });
    toast("已在新终端窗口续聊", "ok");
  } catch (e) { toast(e.message, "err"); }
}
async function doTest(name) {
  const el = document.getElementById(`test-${name}`);
  el.className = "test-result testing";
  el.textContent = "测试中…";
  try {
    const r = await api(`/api/profiles/${encodeURIComponent(name)}/test`,
      { method: "POST", body: "{}" });
    if (r.auth === "ok") {
      el.className = "test-result ok";
      el.textContent = `✓ ${r.latency_ms}ms`;
    } else if (r.auth === "failed") {
      el.className = "test-result bad";
      el.textContent = `✗ 鉴权失败 ${r.http_status}`;
    } else {
      el.className = "test-result testing";
      el.textContent = `? ${r.latency_ms}ms HTTP ${r.http_status}`;
      el.title = "端点可达,但无法确认鉴权(可能未配 token)";
    }
  } catch (e) {
    el.className = "test-result bad";
    el.textContent = "✗ 连不通";
    el.title = e.message;
  }
}
async function delProfile(name) {
  if (!confirm(`删除 profile "${name}"?\n\n~/.claude-${name} 目录和历史会话保留,仅解除托管。`)) return;
  try {
    await api(`/api/profiles/${encodeURIComponent(name)}?confirm=true`, { method: "DELETE" });
    openSess.delete(name);
    toast("已删除", "ok");
    await loadAll();
  } catch (e) { toast(e.message, "err"); }
}
async function importAll(names) {
  for (const name of names) {
    try { await api("/api/profiles/import", { method: "POST", body: JSON.stringify({ name }) }); }
    catch (e) { toast(`${name}:${e.message}`, "err"); return; }
  }
  toast("已全部导入", "ok");
  await loadAll();
}

/* ---------- export / import ---------- */
async function doExport() {
  const withSecrets = confirm(
    "导出全部 profile 配置?\n\n「确定」= 包含 token 明文(文件请妥善保管)\n「取消」= token 脱敏(导入后需重新填写 token)");
  try {
    const data = await api(`/api/export${withSecrets ? "?include_secrets=true" : ""}`);
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `ccp-profiles-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast(withSecrets ? "已导出(含明文 token)" : "已导出(token 已脱敏)", "ok");
  } catch (e) { toast(e.message, "err"); }
}
function pickImport() { document.getElementById("import-file").click(); }
async function doImportFile(ev) {
  const file = ev.target.files[0];
  ev.target.value = "";
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); }
  catch { toast("文件不是有效 JSON", "err"); return; }
  if (!Array.isArray(data.profiles)) { toast("文件缺少 profiles 数组", "err"); return; }
  const overwrite = confirm("遇到同名 profile 时:\n\n「确定」= 覆盖合并\n「取消」= 跳过");
  try {
    const r = await api("/api/import", {
      method: "POST",
      body: JSON.stringify({
        profiles: data.profiles, shared: data.shared,
        policy: overwrite ? "overwrite" : "skip",
      }),
    });
    const parts = [];
    if (r.created.length) parts.push(`新建 ${r.created.length}`);
    if (r.updated.length) parts.push(`更新 ${r.updated.length}`);
    if (r.skipped.length) parts.push(`跳过 ${r.skipped.length}`);
    if (r.errors.length) parts.push(`失败 ${r.errors.length}`);
    toast(`导入完成:${parts.join("、") || "无变化"}`, r.errors.length ? "err" : "ok");
    await loadAll();
  } catch (e) { toast(e.message, "err"); }
}

/* ---------- editor modal ---------- */
function renderPresetSelect() {
  const sel = document.getElementById("f-preset");
  const groups = {};
  for (const p of presets) (groups[p.category] ??= []).push(p);
  sel.innerHTML = '<option value="">— 不选预设 —</option>' +
    Object.entries(groups).map(([cat, items]) =>
      `<optgroup label="${esc(cat)}">` +
      items.map(p => `<option value="${esc(p.key)}">${esc(p.label)}</option>`).join("") +
      "</optgroup>").join("");
  sel.onchange = () => {
    const p = presets.find(x => x.key === sel.value);
    if (!p) return;
    clearStdFields();
    for (const [id, key] of STD_FIELDS)
      if (p.env[key]) document.getElementById(id).value = p.env[key];
  };
}
function clearStdFields() {
  for (const [id] of STD_FIELDS) {
    const el = document.getElementById(id);
    el.value = ""; el.placeholder = "";
  }
  document.getElementById("kv-list").innerHTML = "";
}
function kvRow(listId, key = "", val = "", masked = "") {
  const row = document.createElement("div");
  row.className = "kvrow";
  row.innerHTML = `
    <input class="kv-k" placeholder="KEY" value="${esc(key)}">
    <input class="kv-v" placeholder="${masked ? esc(masked) + "(留空不变)" : "value"}" value="${esc(val)}">
    <button class="btn-danger" title="删除该变量">×</button>`;
  row.querySelector("button").onclick = () => {
    if (row.dataset.existing) {
      row.dataset.deleted = "1";
      row.style.opacity = 0.35;
    } else row.remove();
  };
  document.getElementById(listId).appendChild(row);
  return row;
}
function collectKv(listId, out) {
  for (const row of document.querySelectorAll(`#${listId} .kvrow`)) {
    const k = row.querySelector(".kv-k").value.trim();
    const v = row.querySelector(".kv-v").value;
    if (!k) continue;
    if (row.dataset.deleted) { out[k] = ""; continue; }
    if (v === "" && row.dataset.existing) continue;
    out[k] = v;
  }
}
async function openEditor(name) {
  editing = name || null;
  document.getElementById("editor-title").textContent = editing ? `编辑:${editing}` : "新建 profile";
  document.getElementById("create-only").style.display = editing ? "none" : "block";
  document.getElementById("editor-msg").textContent = "";
  clearStdFields();
  document.getElementById("f-name").value = "";
  document.getElementById("f-preset").value = "";
  if (editing) {
    const { profiles } = await api("/api/profiles");
    const p = profiles.find(x => x.name === editing);
    if (!p) return;
    for (const [id, key] of STD_FIELDS)
      if (p.env[key]) document.getElementById(id).placeholder = p.env[key] + "(留空不变)";
    for (const [k, v] of Object.entries(p.env))
      if (!STD_KEYS.has(k)) kvRow("kv-list", k, "", v).dataset.existing = "1";
  }
  document.getElementById("modal-backdrop").hidden = false;
}
async function saveEditor() {
  const msg = document.getElementById("editor-msg");
  msg.textContent = "";
  const env = {};
  for (const [id, key] of STD_FIELDS) {
    const v = document.getElementById(id).value;
    if (v !== "") env[key] = v;
  }
  collectKv("kv-list", env);
  try {
    if (editing) {
      await api(`/api/profiles/${encodeURIComponent(editing)}`,
        { method: "PUT", body: JSON.stringify({ env }) });
    } else {
      const name = document.getElementById("f-name").value.trim();
      const preset = document.getElementById("f-preset").value || null;
      await api("/api/profiles", { method: "POST", body: JSON.stringify({ name, preset, env }) });
    }
    document.getElementById("modal-backdrop").hidden = true;
    toast("已保存", "ok");
    await loadAll();
  } catch (e) { msg.textContent = e.message; }
}

/* ---------- shared modal ---------- */
async function openShared() {
  const shared = await api("/api/shared");
  const list = document.getElementById("shared-list");
  list.innerHTML = "";
  for (const [k, v] of Object.entries(shared))
    kvRow("shared-list", k, "", v).dataset.existing = "1";
  document.getElementById("shared-msg").textContent = "";
  document.getElementById("shared-backdrop").hidden = false;
}
async function saveShared() {
  const msg = document.getElementById("shared-msg");
  const env = {};
  collectKv("shared-list", env);
  if (Object.keys(env).length === 0) {
    document.getElementById("shared-backdrop").hidden = true;
    toast("没有需要保存的改动");
    return;
  }
  try {
    await api("/api/shared", { method: "PUT", body: JSON.stringify({ env }) });
    document.getElementById("shared-backdrop").hidden = true;
    toast("共享变量已保存", "ok");
  } catch (e) { msg.textContent = e.message; }
}

/* ---------- wiring ---------- */
document.getElementById("new-btn").onclick = () => openEditor(null);
document.getElementById("editor-cancel").onclick = () =>
  document.getElementById("modal-backdrop").hidden = true;
document.getElementById("editor-save").onclick = saveEditor;
document.getElementById("kv-add").onclick = () => kvRow("kv-list");
document.getElementById("shared-btn").onclick = openShared;
document.getElementById("shared-add").onclick = () => kvRow("shared-list");
document.getElementById("shared-save").onclick = saveShared;
document.getElementById("shared-cancel").onclick = () =>
  document.getElementById("shared-backdrop").hidden = true;
document.getElementById("export-btn").onclick = doExport;
document.getElementById("import-btn").onclick = pickImport;
document.getElementById("import-file").onchange = doImportFile;
for (const id of ["modal-backdrop", "shared-backdrop"]) {
  document.getElementById(id).addEventListener("click", e => {
    if (e.target.id === id) e.target.hidden = true;
  });
}

loadAll().catch(e => toast(`加载失败:${e.message}`, "err"));
</script>
</body>
</html>
