# ccp provider presets — field shape mirrors cc-switch's providerPresets
# (category / website_url / api_key_url / api_format / env) so the table can
# be synced from upstream. Base URLs were ported from cc-switch's preset
# source; re-verify against each vendor's docs when editing.

[[preset]]
key = "anthropic"
label = "Anthropic (official)"
category = "official"
website_url = "https://www.anthropic.com"
api_key_url = "https://console.anthropic.com/settings/keys"
api_format = "anthropic"
[preset.env]
# Official login needs no base URL; leave env empty.

[[preset]]
key = "moonshot"
label = "Kimi (Moonshot)"
category = "cn_official"
website_url = "https://platform.moonshot.cn"
api_key_url = "https://platform.moonshot.cn/console/api-keys"
api_format = "anthropic"
[preset.env]
ANTHROPIC_BASE_URL = "https://api.moonshot.cn/anthropic"

[[preset]]
key = "moonshot-coding"
label = "Kimi For Coding"
category = "cn_official"
api_format = "anthropic"
[preset.env]
ANTHROPIC_BASE_URL = "https://api.kimi.com/coding/"
CLAUDE_CODE_MAX_CONTEXT_TOKENS = "262144"

